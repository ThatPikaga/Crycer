name: Checks
on: { push: { branches: [main, master] }, pull_request: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check the editor in Chrome
        timeout-minutes: 5
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/review-regression.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: shots/, if-no-files-found: ignore }
